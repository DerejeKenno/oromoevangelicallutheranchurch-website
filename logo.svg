<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Oromo Evangelical Lutheran Church logo">
  <defs>
    <radialGradient id="sunGlow" cx="28%" cy="22%" r="42%">
      <stop offset="0" stop-color="#ffe68a" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffe68a" stop-opacity="0.45"/>
      <stop offset="0.48" stop-color="#ffe68a" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffe68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="18" y1="10" x2="82" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fbff0"/>
      <stop offset="0.52" stop-color="#8fddff"/>
      <stop offset="1" stop-color="#d5f3ff"/>
    </linearGradient>
    <path id="topTextArc" d="M 15 56 A 35 35 0 0 1 85 56"/>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="47"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#sky)"/>
  <g clip-path="url(#circleClip)">
    <circle cx="28" cy="22" r="7" fill="#ffe16d" opacity="0.95"/>
    <circle cx="28" cy="22" r="35" fill="url(#sunGlow)"/>
    <g stroke="#fff1a9" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
      <path d="M28 6v8"/>
      <path d="M10 22h9"/>
      <path d="M16 10l6 7"/>
      <path d="M40 10l-6 7"/>
      <path d="M11 35l8-4"/>
      <path d="M44 34l-8-4"/>
    </g>
    <ellipse cx="31" cy="70" rx="18" ry="6" fill="#ffffff" opacity="0.58"/>
    <ellipse cx="77" cy="33" rx="14" ry="5" fill="#ffffff" opacity="0.48"/>

    <!-- Red cross based on the attached church cross silhouette. -->
    <g fill="#c62828">
      <polygon points="49,14 61,6 61,84 49,94"/>
      <polygon points="41,21 49,14 49,94 41,88"/>
      <polygon points="18,38 49,38 49,48 12,48"/>
      <polygon points="61,38 88,38 82,48 61,48"/>
      <polygon points="31,29 49,29 49,37 23,37"/>
      <polygon points="61,29 80,29 86,37 61,37"/>
    </g>
  </g>

  <circle cx="50" cy="50" r="48" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="50" cy="50" r="40.5" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="1"/>

  <text font-family="Inter, Arial, sans-serif" font-size="5.2" font-weight="800" letter-spacing="0.7" fill="#ffffff">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">OROMO EVANGELICAL LUTHERAN CHURCH</textPath>
  </text>
</svg>
