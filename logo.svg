<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Oromo Evangelical Lutheran Church logo">
  <defs>
    <linearGradient id="sky" x1="18" y1="10" x2="82" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fbff0"/>
      <stop offset="0.52" stop-color="#8fddff"/>
      <stop offset="1" stop-color="#d5f3ff"/>
    </linearGradient>
    <path id="topTextArc" d="M 7 55 A 43 43 0 0 1 93 55"/>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="47"/>
    </clipPath>
  </defs>

  <circle cx="50" cy="50" r="48" fill="url(#sky)"/>
  <g clip-path="url(#circleClip)">
    <ellipse cx="31" cy="70" rx="18" ry="6" fill="#ffffff" opacity="0.58"/>
    <ellipse cx="77" cy="33" rx="14" ry="5" fill="#ffffff" opacity="0.48"/>

    <!-- Uniform single red cross with consistent horizontal and vertical edges. -->
    <path
      d="M45 24 L55 24 L55 45 L77 45 L77 55 L55 55 L55 82 L45 82 L45 55 L23 55 L23 45 L45 45 Z"
      fill="#c62828"
    />
  </g>

  <circle cx="50" cy="50" r="48" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>

  <text font-family="Inter, Arial, sans-serif" font-size="4.2" font-weight="800" letter-spacing="0.45" fill="#ffffff">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">OROMO EVANGELICAL LUTHERAN CHURCH</textPath>
  </text>
</svg>
